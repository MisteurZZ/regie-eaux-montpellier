name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install "homeassistant==2026.11.2" "pytest-homeassistant==2026.11.2"
      - run: python -m pytest -q
